<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mergington High School Activities</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <header>
      <h1>Mergington High School</h1>
      <h2>Extracurricular Activities</h2>
    </header>

    <main>
      <section id="activities-container">
        <h3>Available Activities</h3>
        <div id="activities-list">
          <p>Loading activities...</p>
        </div>
      </section>

      <section id="submission-container">
        <h3>Submit a New Activity</h3>
        <form id="submission-form">
          <div class="form-group">
            <label for="new-activity-name">Activity Name:</label>
            <input type="text" id="new-activity-name" placeholder="Robotics Club" required />
          </div>
          <div class="form-group">
            <label for="new-activity-description">Description:</label>
            <textarea id="new-activity-description" rows="3" placeholder="Describe the activity"></textarea>
          </div>
          <div class="form-group">
            <label for="new-activity-schedule">Schedule:</label>
            <input type="text" id="new-activity-schedule" placeholder="Wednesdays, 3:30 PM - 5:00 PM" />
          </div>
          <div class="form-group">
            <label for="new-activity-max">Max Participants:</label>
            <input type="number" id="new-activity-max" min="1" value="15" />
          </div>
          <div class="form-group">
            <label for="new-activity-age">Age Range:</label>
            <input type="text" id="new-activity-age" placeholder="Middle School" />
          </div>
          <div class="form-group">
            <label for="new-venue-name">Venue Name:</label>
            <input type="text" id="new-venue-name" placeholder="Innovation Lab" required />
          </div>
          <div class="form-group">
            <label for="new-venue-address">Venue Address:</label>
            <input type="text" id="new-venue-address" placeholder="77 Maker Street, Mergington" />
          </div>
          <button type="submit">Submit Activity</button>
        </form>
        <div id="submission-message" class="hidden"></div>
      </section>

      <section id="signup-container">
        <h3>Sign Up for an Activity</h3>
        <form id="signup-form">
          <div class="form-group">
            <label for="email">Student Email:</label>
            <input type="email" id="email" required placeholder="your-email@mergington.edu" />
          </div>
          <div class="form-group">
            <label for="activity">Select Activity:</label>
            <select id="activity" required>
              <option value="">-- Select an activity --</option>
            </select>
          </div>
          <button type="submit">Sign Up</button>
        </form>
        <div id="message" class="hidden"></div>
      </section>
    </main>

    <footer>
      <p>&copy; 2026 Mergington High School</p>
    </footer>

    <script src="app.js"></script>
  </body>
</html>
